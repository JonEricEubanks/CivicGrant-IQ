<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F1E"/>
      <stop offset="100%" style="stop-color:#0F1F3A"/>
    </linearGradient>
    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="mergeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <radialGradient id="orchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="mergeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- agent pulse animations -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6" opacity="0.7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981" opacity="0.7"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#EF4444" opacity="0.7"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B" opacity="0.7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7" opacity="0.7"/>
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bg)" rx="14"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1E3A5F" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="192" y1="0" x2="192" y2="480"/>
    <line x1="384" y1="0" x2="384" y2="480"/>
    <line x1="576" y1="0" x2="576" y2="480"/>
    <line x1="768" y1="0" x2="768" y2="480"/>
  </g>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">5 Parallel Specialist Agents — Concurrent Orchestration</text>
  <text x="480" y="54" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748B">All agents fire simultaneously · withFallback() guarantees a result · Red Team only spawns above 55% viability</text>

  <!-- ═══════ ORCHESTRATOR (top center) ═══════ -->
  <ellipse cx="480" cy="110" rx="70" ry="70" fill="url(#orchGlow)"/>
  <rect x="390" y="80" width="180" height="60" rx="10" fill="url(#orchGrad)" filter="url(#shadow)"/>
  <text x="480" y="104" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFF">Query Router</text>
  <text x="480" y="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#BFDBFE">chat.ts · runAllAgents()</text>
  <text x="480" y="134" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#93C5FD">Promise.allSettled()</text>
  <!-- pulsing border -->
  <rect x="390" y="80" width="180" height="60" rx="10" fill="none" stroke="#60A5FA" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══════ DISPATCH LINES (fan out) ═══════ -->
  <!-- Agent 1: Main Analyst (leftmost) -->
  <line x1="430" y1="140" x2="96" y2="230" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowBlue)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <!-- Agent 2: Red Team -->
  <line x1="450" y1="140" x2="240" y2="230" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowRed)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <!-- Agent 3: Competitive Intel -->
  <line x1="480" y1="140" x2="480" y2="230" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowAmber)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.0s" repeatCount="indefinite"/>
  </line>
  <!-- Agent 4: Portfolio Scan -->
  <line x1="510" y1="140" x2="720" y2="230" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowPurple)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <!-- Agent 5: Narrative -->
  <line x1="530" y1="140" x2="864" y2="230" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowViolet)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- ═══════ AGENT CARDS ═══════ -->

  <!-- Agent 1: Main Analyst (6-step chain) -->
  <rect x="16" y="232" width="160" height="100" rx="9" fill="#0C1A3A" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="16" y="232" width="160" height="28" rx="9" fill="#1D4ED8" fill-opacity="0.7"/>
  <rect x="16" y="248" width="160" height="12" fill="#1D4ED8" fill-opacity="0.7"/>
  <text x="96" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#93C5FD">📊 Main Analyst</text>
  <text x="96" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" fill="#BFDBFE">runSixStepChain()</text>
  <text x="96" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Parse → Match → Verify</text>
  <text x="96" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Gap → Narrative → Strategy</text>
  <text x="96" y="318" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#64748B">Foundry Assistants API</text>
  <!-- glow on card -->
  <rect x="16" y="232" width="160" height="100" rx="9" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Agent 2: Red Team -->
  <rect x="160" y="232" width="160" height="100" rx="9" fill="#1A0A0A" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="160" y="232" width="160" height="28" rx="9" fill="#991B1B" fill-opacity="0.8"/>
  <rect x="160" y="248" width="160" height="12" fill="#991B1B" fill-opacity="0.8"/>
  <text x="240" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">🔴 Red Team</text>
  <text x="240" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" fill="#FECACA">runRedTeamReview()</text>
  <text x="240" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">GS-14 Federal Reviewer</text>
  <text x="240" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Challenges every claim</text>
  <text x="240" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#EF4444" font-weight="600">Only if score &gt; 55%</text>
  <rect x="160" y="232" width="160" height="100" rx="9" fill="none" stroke="#EF4444" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Agent 3: Competitive Intel -->
  <rect x="400" y="232" width="160" height="100" rx="9" fill="#0F1A0A" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="400" y="232" width="160" height="28" rx="9" fill="#92400E" fill-opacity="0.8"/>
  <rect x="400" y="248" width="160" height="12" fill="#92400E" fill-opacity="0.8"/>
  <text x="480" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#FCD34D">🕵 Competitive Intel</text>
  <text x="480" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" fill="#FDE68A">runCompetitiveIntel()</text>
  <text x="480" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Peer city comparison</text>
  <text x="480" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Win/loss pattern analysis</text>
  <text x="480" y="318" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#64748B">AI Search + OpenAI</text>
  <rect x="400" y="232" width="160" height="100" rx="9" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Agent 4: Portfolio Scan -->
  <rect x="640" y="232" width="160" height="100" rx="9" fill="#10001A" stroke="#A855F7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="640" y="232" width="160" height="28" rx="9" fill="#7E22CE" fill-opacity="0.8"/>
  <rect x="640" y="248" width="160" height="12" fill="#7E22CE" fill-opacity="0.8"/>
  <text x="720" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#D8B4FE">📋 Portfolio Scan</text>
  <text x="720" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" fill="#E9D5FF">runPortfolioScan()</text>
  <text x="720" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Live Grants.gov search</text>
  <text x="720" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Deadline + eligibility check</text>
  <text x="720" y="318" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#64748B">scan.ts · portfolio_item SSE</text>
  <rect x="640" y="232" width="160" height="100" rx="9" fill="none" stroke="#A855F7" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Agent 5: Narrative Refinement -->
  <rect x="784" y="232" width="160" height="100" rx="9" fill="#0C001A" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="784" y="232" width="160" height="28" rx="9" fill="#6D28D9" fill-opacity="0.8"/>
  <rect x="784" y="248" width="160" height="12" fill="#6D28D9" fill-opacity="0.8"/>
  <text x="864" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">✍ Narrative Refine</text>
  <text x="864" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" fill="#DDD6FE">runNarrativeRefinement()</text>
  <text x="864" y="289" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Polishes application prose</text>
  <text x="864" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">Equity + Justice40 framing</text>
  <text x="864" y="318" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#64748B">refined_narrative SSE</text>
  <rect x="784" y="232" width="160" height="100" rx="9" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══════ RETURN LINES (fan in to merge) ═══════ -->
  <line x1="96" y1="332" x2="430" y2="390" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="240" y1="332" x2="450" y2="390" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <line x1="480" y1="332" x2="480" y2="390" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="720" y1="332" x2="510" y2="390" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <line x1="864" y1="332" x2="530" y2="390" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowGreen)" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <!-- ═══════ MERGE NODE ═══════ -->
  <ellipse cx="480" cy="415" rx="60" ry="60" fill="url(#mergeGlow)"/>
  <rect x="360" y="392" width="240" height="62" rx="10" fill="url(#mergeGrad)" filter="url(#shadow)"/>
  <text x="480" y="415" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFF">Merge &amp; Synthesize</text>
  <text x="480" y="431" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#A7F3D0">mergeAgentResults() · widget SSE · done SSE</text>
  <text x="480" y="447" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#6EE7B7">17-rule guardrail pipeline → streamed to client</text>
  <rect x="360" y="392" width="240" height="62" rx="10" fill="none" stroke="#10B981" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- withFallback badge -->
  <rect x="16" y="348" width="128" height="20" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="80" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">withFallback() ✓</text>

  <rect x="160" y="348" width="128" height="20" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="224" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">withFallback() ✓</text>

  <rect x="400" y="348" width="128" height="20" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="464" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">withFallback() ✓</text>

  <rect x="640" y="348" width="128" height="20" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="704" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">withFallback() ✓</text>

  <rect x="784" y="348" width="128" height="20" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="848" y="362" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#94A3B8">withFallback() ✓</text>
</svg>
