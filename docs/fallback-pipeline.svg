<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <path id="fbpath" d="M500,112 L500,470" fill="none"/>
  </defs>
  <style>
    .flow{fill:none;stroke-width:2.5;stroke-dasharray:7 7;animation:dash 0.9s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .tt{font-size:15px;font-weight:700;fill:#201F1E}
    .ts{font-size:11.5px;fill:#484644}
    .fail{font-size:11px;font-weight:700;fill:#D13438}
  </style>

  <rect width="1000" height="540" fill="#FAF9F8"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#201F1E">♻️ 3-Tier Never-Down Fallback</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#605E5C">Every request succeeds — even with zero credentials</text>

  <!-- request pill -->
  <rect x="400" y="76" width="200" height="36" rx="18" fill="#201F1E"/>
  <text x="500" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">⚡ REQUEST</text>

  <!-- spine + travelling dot -->
  <use href="#fbpath" class="flow" stroke="#C19C00"/>
  <circle r="6" fill="#C19C00">
    <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#fbpath"/></animateMotion>
  </circle>

  <!-- TIER 1 -->
  <g>
    <rect x="220" y="140" width="560" height="86" rx="10" fill="#ffffff" stroke="#E1DFDD"/>
    <rect x="220" y="140" width="6" height="86" rx="3" fill="#107C10"/>
    <rect x="220" y="140" width="560" height="86" rx="10" fill="#107C10" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="0s" repeatCount="indefinite" keyTimes="0;0.02;0.3;0.33;1" values="0;0.14;0.14;0;0"/>
    </rect>
    <text x="248" y="172" class="tt">TIER 1 — Foundry Assistants API</text>
    <text x="248" y="196" class="ts">Full reasoning · MCP knowledge_base_retrieve · 30s timeout</text>
    <text x="248" y="214" class="ts">Foundry IQ grounding · GraphRAG evidence paths</text>
  </g>
  <!-- fail flash 1 -->
  <g opacity="0">
    <text x="540" y="248" class="fail">✗ timeout / error → fall through</text>
    <animate attributeName="opacity" dur="6s" begin="1.2s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.18;1" values="0;1;1;0;0"/>
  </g>

  <!-- TIER 2 -->
  <g>
    <rect x="220" y="260" width="560" height="86" rx="10" fill="#ffffff" stroke="#E1DFDD"/>
    <rect x="220" y="260" width="6" height="86" rx="3" fill="#C19C00"/>
    <rect x="220" y="260" width="560" height="86" rx="10" fill="#C19C00" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="1.8s" repeatCount="indefinite" keyTimes="0;0.02;0.3;0.33;1" values="0;0.14;0.14;0;0"/>
    </rect>
    <text x="248" y="292" class="tt">TIER 2 — Chat Completions + AI Search</text>
    <text x="248" y="316" class="ts">Streaming · KB context injection · lower cost</text>
    <text x="248" y="334" class="ts">Azure OpenAI gpt-4o-mini · Azure AI Search grounding</text>
  </g>
  <!-- fail flash 2 -->
  <g opacity="0">
    <text x="540" y="368" class="fail">✗ rate limit / error → fall through</text>
    <animate attributeName="opacity" dur="6s" begin="3s" repeatCount="indefinite" keyTimes="0;0.05;0.12;0.18;1" values="0;1;1;0;0"/>
  </g>

  <!-- TIER 3 -->
  <g>
    <rect x="220" y="380" width="560" height="86" rx="10" fill="#ffffff" stroke="#E1DFDD"/>
    <rect x="220" y="380" width="6" height="86" rx="3" fill="#D13438"/>
    <rect x="220" y="380" width="560" height="86" rx="10" fill="#D13438" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="3.6s" repeatCount="indefinite" keyTimes="0;0.02;0.3;0.33;1" values="0;0.14;0.14;0;0"/>
    </rect>
    <text x="248" y="412" class="tt">TIER 3 — Deterministic Mock Engine</text>
    <text x="248" y="436" class="ts">Zero credentials · fully local · always succeeds</text>
    <text x="248" y="454" class="ts">Simulated 6-step chain · static city context · no external calls</text>
  </g>

  <!-- success pill -->
  <g>
    <rect x="385" y="478" width="230" height="34" rx="17" fill="#DFF6DD" stroke="#107C10"/>
    <rect x="385" y="478" width="230" height="34" rx="17" fill="#107C10" opacity="0">
      <animate attributeName="opacity" dur="6s" begin="4.4s" repeatCount="indefinite" keyTimes="0;0.04;0.2;0.26;1" values="0;0.25;0.25;0;0"/>
    </rect>
    <text x="500" y="500" text-anchor="middle" font-size="12.5" font-weight="800" fill="#107C10">✓ ALWAYS SUCCEEDS</text>
  </g>

  <text x="500" y="532" text-anchor="middle" font-size="11" fill="#605E5C">Impact: the live demo cannot fail — judges can stress-test without quota anxiety · agent.ts lines 1166–1244</text>
</svg>
