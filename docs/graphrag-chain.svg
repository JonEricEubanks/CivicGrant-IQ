  <rect width="1000" height="650" fill="#FAF9F8"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="800" fill="#201F1E">🔗 GraphRAG Evidence Chain — Buffalo Grove → FEMA BRIC</text>
  <text x="500" y="58" text-anchor="middle" font-size="12" fill="#605E5C">Multi-hop BFS traversal · per-hop citations · confidence pre-computed from edge weights</text>

