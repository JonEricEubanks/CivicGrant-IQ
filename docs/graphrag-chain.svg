    .ht{font-size:14px;font-weight:700;fill:#201F1E}
    .he{font-size:11.5px;font-style:italic;fill:#484644}
    .hs{font-size:11px;fill:#605E5C}
    .badge-c{font-size:10.5px;font-weight:700;fill:#107C10}
    .badge-l{font-size:10.5px;font-weight:700;fill:#986F0B}
