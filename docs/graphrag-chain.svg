      <animate attributeName="r" dur="10.5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.01;0.19;0.22;1" values="16;16;28;28;28"/>
      <animate attributeName="opacity" dur="10.5s" begin="0s" repeatCount="indefinite" keyTimes="0;0.01;0.19;0.22;1" values="0;0.7;0;0;0"/>
