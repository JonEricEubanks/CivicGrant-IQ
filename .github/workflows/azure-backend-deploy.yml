name: Deploy Backend to Azure App Service
# Last triggered: 2026-06-12

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/azure-backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Prune dev dependencies
        working-directory: backend
        run: npm prune --production

      - name: Prepare deploy artifact
        run: |
          mkdir deploy-pkg
          cp -r backend/dist deploy-pkg/dist
          cp backend/node_modules deploy-pkg/node_modules -r
          cp backend/package-lock.json deploy-pkg/
          # Write package.json with build script removed so Oryx won't try to run tsc
          node -e "
            const p = require('./backend/package.json');
            delete p.scripts.build;
            delete p.devDependencies;
            require('fs').writeFileSync('./deploy-pkg/package.json', JSON.stringify(p, null, 2));
          "

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: civicgrant-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-pkg
